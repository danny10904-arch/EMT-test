<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMT 學科模擬測驗系統</title>
    <style>
        :root {
            --primary: #c62828;
            --secondary: #1565c0;
            --bg: #f5f5f5;
        }

        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: white;
            max-width: 800px;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
            color: #555;
        }

        .question {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options {
            display: grid;
            gap: 10px;
        }

        button.option {
            padding: 15px;
            text-align: left;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        button.option:hover {
            background: #f0f7ff;
            border-color: var(--secondary);
        }

        .hidden {
            display: none;
        }

        .result-item {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #ccc;
        }

        .correct {
            background: #e8f5e9;
            border-left-color: #4caf50;
        }

        .wrong {
            background: #ffebee;
            border-left-color: #f44336;
        }

        .rationale {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #666;
            font-style: italic;
        }

        #start-screen,
        #result-screen {
            text-align: center;
        }

        .btn-main {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>EMT 學科複習測驗</h1>

        <div id="start-screen">

            <p>從題庫中隨機抽取 <span id="total-count-display"></span> 題。</p>
            <p style="color: #666;">（重要章節如：評估、CPR、創傷、急症佔 80% 出題率）</p>
            <button class="btn-main" onclick="startQuiz()">開始測驗 </button>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="stats">
                <span id="progress">第 1 / ${TOTAL_QUESTIONS} 題</span>
                <span id="score-live">得分: 0</span>
            </div>
            <div id="question-text" class="question"></div>
            <div id="options-container" class="options"></div>

            <div style="margin-top: 25px; display: flex; justify-content: space-between;">
                <button id="prev-btn" onclick="prevQuestion()" class="btn-main" style="background:#666;">上一題</button>
                <button onclick="showResults()" class="btn-main" style="background:#d32f2f;">結束測驗</button>
            </div>
        </div>

        <div id="result-screen" class="hidden">
            <h2>測驗結束</h2>
            <div id="final-score" style="font-size: 2rem; margin: 20px 0;"></div>
            <div id="review-container"></div>
            <button class="btn-main" onclick="location.reload()">重新測驗</button>
        </div>
    </div>

    <script>
        //題目數量
        const TOTAL_QUESTIONS = 30;
        // 2. 網頁載入後自動更新 HTML
        window.onload = function () {
            document.getElementById('total-count-display').innerText = TOTAL_QUESTIONS;
        };
        // 題庫資料 (這部分會隨對話持續更新)
        let questionBank = [];

        // 章節定義：重要程度 1 為高(80%機率)，0 為一般(20%機率)
        const CHAPTERS = {
            HIGH: "重要(評估/CPR/創傷/急症)",
            NORMAL: "一般(法規/導論/後勤)"
        };

        // 載入題庫的函式
        function loadQuestions(data) {
            questionBank = data;
        }

        let currentQuestions = [];
        let userAnswers = [];
        let currentIndex = 0;
        let score = 0;

        function startQuiz() {
            if (questionBank.length < TOTAL_QUESTIONS) {
                alert("題庫載入中，請稍候...");
                return;
            }

            // 8/2 抽題邏輯
            const highWeightPool = questionBank.filter(q => q.weight === 1);
            const normalWeightPool = questionBank.filter(q => q.weight === 0);

            // 計算抽題數量，確保相加等於 TOTAL_QUESTIONS
            const highCount = Math.round(TOTAL_QUESTIONS * 0.8); // 重要章節佔 80%
            const normalCount = TOTAL_QUESTIONS - highCount;     // 剩下的給一般章節

            let selectedHigh = shuffle(highWeightPool).slice(0, highCount);
            let selectedNormal = shuffle(normalWeightPool).slice(0, normalCount);

            currentQuestions = shuffle([...selectedHigh, ...selectedNormal]);

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = currentQuestions[currentIndex];
            // 控制上一題按鈕顯示狀態
            document.getElementById('prev-btn').disabled = (currentIndex === 0);
            document.getElementById('progress').innerText = `第 ${currentIndex + 1} /${TOTAL_QUESTIONS}`;
            document.getElementById('question-text').innerText = q.q;

            const optionsDiv = document.getElementById('options-container');
            optionsDiv.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(idx);
                optionsDiv.appendChild(btn);
            });
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                showQuestion();
            }
        }

        function handleAnswer(choice) {
            const q = currentQuestions[currentIndex];
            userAnswers.push({
                question: q.q,
                options: q.options,
                correct: q.correct,
                userChoice: choice,
                rationale: q.rationale
            });

            if (choice === q.correct) score++;

            currentIndex++;
            if (currentIndex < TOTAL_QUESTIONS) {
                showQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            document.getElementById('final-score').innerText = `最終得分: ${Math.round((score / TOTAL_QUESTIONS) * 100)} 分`;

            const reviewDiv = document.getElementById('review-container');
            reviewDiv.innerHTML = '<h3>錯誤題目檢討：</h3>';

            userAnswers.forEach(ans => {
                if (ans.userChoice !== ans.correct) {
                    const item = document.createElement('div');
                    item.className = 'result-item wrong';
                    item.innerHTML = `
                <div><strong>問：${ans.question}</strong></div>
                <div style="color:red">您的答案：${ans.options[ans.userChoice]}</div>
                <div style="color:green">正確答案：${ans.options[ans.correct]}</div>
                <div class="rationale">解析：${ans.rationale}</div>
            `;
                    reviewDiv.appendChild(item);
                }
            });
        }

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        // ----------------------------------------------------
        // 題庫資料開始 (第 1-50 題)
        // weight: 1 為重要章節，0 為普通章節
        // ----------------------------------------------------
        loadQuestions([
            {
                q: "救護技術員執行救護勤務時，首要考量為何？",
                options: ["病患安全", "現場環境安全", "儘速送醫", "家屬情緒"],
                correct: 1,
                weight: 1,
                rationale: "場景評估中，自身與隊友的安全永遠是第一順位，無安全現場即無法施救。"
            },
            {
                q: "成人心肺復甦術(CPR)中，胸部按壓與人工呼吸的比例為何？",
                options: ["15:2", "30:2", "30:1", "5:1"],
                correct: 1,
                weight: 1,
                rationale: "單人或雙人成人CPR比例皆為 30:2。"
            },
            {
                q: "評估意識狀態時，AVPU 刻度中的 'P' 代表什麼？",
                options: ["清醒(Alert)", "對聲音有反應", "對疼痛有反應", "無反應"],
                correct: 2,
                weight: 1,
                rationale: "P 代表 Pain，即病患僅在施加疼痛刺激時才有反應。"
            },
            {
                q: "對於大出血傷口，現場第一線採用的止血方法通常為何？",
                options: ["止血帶", "止血點壓迫法", "直接壓迫止血法", "抬高傷肢"],
                correct: 2,
                weight: 1,
                rationale: "直接壓迫止血法是目前最優先且有效的初步止血手段。"
            },
            {
                q: "依據救護技術員管理辦法，EMT-1 證書有效期限為幾年？",
                options: ["2年", "3年", "4年", "5年"],
                correct: 1,
                weight: 0,
                rationale: "目前法定 EMT-1 及 EMT-2 證書效期皆為 3 年。"
            },
            {
                q: "懷疑病患頸椎受傷時，應採用何種方式開放呼吸道？",
                options: ["仰頭抬頦法", "下顎推擠法(Jaw-thrust)", "側臥法", "置入鼻咽呼吸道"],
                correct: 1,
                weight: 1,
                rationale: "下顎推擠法可以在不移動頸椎的情況下開放呼吸道。"
            },
            {
                q: "關於 AED 的敘述，下列何者錯誤？",
                options: ["AED 可以自動分析心律", "若病患有自發性呼吸，不應電擊", "黏貼電擊片前需先擦乾胸部汗水", "分析心律時可以持續 CPR"],
                correct: 3,
                weight: 1,
                rationale: "AED 分析心律時不可碰觸病患，以免干擾判讀。"
            },
            {
                q: "正常成人休息狀態下，呼吸次數約為每分鐘幾次？",
                options: ["8-10次", "12-20次", "20-30次", "30次以上"],
                correct: 1,
                weight: 1,
                rationale: "正常成人呼吸速率約為 12-20 次/分。"
            },
            {
                q: "創傷病患評估中，SAMPLE 詢問病史，'A' 代表什麼？",
                options: ["年齡(Age)", "過敏史(Allergy)", "救護車類型", "受傷機制"],
                correct: 1,
                weight: 1,
                rationale: "SAMPLE 中的 A 代表 Allergy 過敏史，對於藥物使用非常重要。"
            },
            {
                q: "執行成人 CPR 時，按壓深度應至少達幾公分？",
                options: ["3公分", "5公分", "7公分", "10公分"],
                correct: 1,
                weight: 1,
                rationale: "成人按壓深度應至少 5 公分，但不可超過 6 公分。"
            },
            // ... 此處為了對話精簡，我先列出 10 題示範，下一段對話會立刻補足第 11-100 題 ...
            // ==========================================
            // 【核心重要章節：評估/呼吸道/創傷/急症】(Weight: 1)
            // ==========================================
            {
                q: "成人心肺復甦術(CPR)時，按壓的速率應維持在每分鐘幾次？",
                options: ["80-100次", "100-120次", "120-140次", "不限速率，壓越快越好"],
                correct: 1,
                weight: 1,
                rationale: "根據最新心肺復甦指引，成人與兒童之高品質CPR按壓速率皆為每分鐘 100-120 次。"
            },
            {
                q: "使用口咽呼吸道(OPA)時，適當長度的測量方式為何？",
                options: ["從病患門牙到下顎角", "從病患嘴角到耳垂或下顎角", "從病患鼻尖到耳垂", "從病患嘴角到劍突"],
                correct: 1,
                weight: 1,
                rationale: "口咽呼吸道(OPA)的適當長度為嘴角至耳垂或下顎角；鼻咽呼吸道(NPA)則為鼻尖至耳垂。"
            },
            {
                q: "當病患呈現嚴重呼吸道異物哽塞且意識清醒時，EMT 應立即實施何種處置？",
                options: ["立即實施 CPR", "敲擊病患背部", "哈姆立克法(腹部衝擊法)", "嘗試用手指盲挖異物"],
                correct: 2,
                weight: 1,
                rationale: "清醒的嚴重異物哽塞病患，首選處置為哈姆立克法（腹部衝擊法）；若病患變清醒為昏迷則立即改為 CPR。"
            },
            {
                q: "在進行救護車搬運創傷病患時，若強烈懷疑有脊椎損傷，應使用何種器材固定？",
                options: ["椅式擔架", "長胸背帶", "長頭部固定器與長板擔架(KED或長板)", "軟式擔架"],
                correct: 2,
                weight: 1,
                rationale: "脊椎損傷或懷疑脊椎損傷之創傷病患，必須使用頸圈、長板擔架及頭部固定器進行全面限制移動。"
            },
            {
                q: "在傷患初評中，若評估發現其呼吸微弱、速率每分鐘僅 6 次，EMT 應首選何種呼吸處置？",
                options: ["使用非反吸入型面罩(NRM)給予高濃度氧氣", "使用鼻導管(NC)給予低流量氧氣", "使用袋瓣罩蘇醒球(BVM)進行輔助通氣", "暫不處置，持續觀察"],
                correct: 2,
                weight: 1,
                rationale: "當病患呼吸過慢（<10次/分）或過快且極度無力，代表通氣量不足，應直接使用 BVM 進行正壓輔助通氣，而非僅給予面罩吸氧。"
            },
            {
                q: "評估微血管充填時間(CRT)時，正常人的充填時間應在幾秒內完成？",
                options: ["1秒內", "2秒內", "3秒內", "5秒內"],
                correct: 1,
                weight: 1,
                rationale: "正常微血管充填時間（CRT）應小於或等於 2 秒，超過 2 秒代表周邊末梢灌流不足、可能處於休克狀態。"
            },
            {
                q: "初評時若發現創傷病患有「開放性氣胸」（吸入性胸部傷口），現場第一線處置為何？",
                options: ["立即實施胸部針刺減壓", "以三邊膠帶固定不透氣敷料(非透氣膠布包覆三邊)", "直接強力壓迫止血", "將傷口完全封死不留任何縫隙"],
                correct: 1,
                weight: 1,
                rationale: "開放性氣胸應使用三邊固定敷料（單向閥原理），容許胸腔內氣體排出，並防止外界空氣在吸氣時進入。"
            },
            {
                q: "若病患發生過敏性休克(Anaphylactic Shock)，其主要病理生理機轉屬於下列哪一種休克？",
                options: ["低血容性休克", "心源性休克", "分布性休克", "阻斷性休克"],
                correct: 2,
                weight: 1,
                rationale: "過敏性休克、神經源性休克及敗血性休克，皆屬於血管過度擴張所致的「分布性休克」。"
            },
            {
                q: "下列何者為心包填塞(Cardiac Tamponade)的典型臨床表徵（貝克氏三聯徵 Beck's triad）？",
                options: ["高血壓、心跳慢、呼吸不規則", "低血壓、頸靜脈怒張、心音遙遠", "低血壓、心跳快、氣管偏移", "高血壓、頻脈、發紺"],
                correct: 1,
                weight: 1,
                rationale: "貝克氏三聯徵（Beck's Triad）包含：低血壓、頸靜脈怒張、心音遙遠（心音聽診模糊）。"
            },
            {
                q: "對於一歲以下的嬰兒實施單人 CPR 時，正確的胸部按壓手法為何？",
                options: ["使用雙手掌根重疊按壓", "使用單手掌根按壓", "使用兩隻手指（食指與中指）按壓", "使用雙手環抱大拇指按壓"],
                correct: 2,
                weight: 1,
                rationale: "嬰兒單人 CPR 使用兩指（食、中指）按壓；若是雙人CPR，則首選雙手環抱大拇指按壓法。"
            },
            {
                q: "當 AED 指示「不建議電擊」時，救護人員下一步應如何處置？",
                options: ["立即觸摸頸動脈搏動", "重新啟動 AED 再分析一次", "立即回復高品質 CPR 按壓", "給予病患兩次人工呼吸"],
                correct: 2,
                weight: 1,
                rationale: "不論 AED 提示電擊或不建議電擊，皆應立即回復 CPR 壓胸，不可因摸脈搏而中斷壓胸。"
            },
            {
                q: "使用止血帶止血時，以下原則何者錯誤？",
                options: ["應綁在傷口上方（近心端）約 5-7 公分處", "不可綁在關節處", "止血帶綁定後應每 15 分鐘鬆開一次以防細胞壞死", "必須在止血帶上標註綁定的時間"],
                correct: 2,
                weight: 1,
                rationale: "到院前止血帶一旦綁上，除非特殊醫療指導否則「不可自行鬆開」，以免造成毒素回流或二度大失血。"
            },
            {
                q: "一位 45 歲男性突發劇烈胸痛，痛感延伸至背部，且兩上肢血壓相差達 30 mmHg，應高度懷疑為何種急症？",
                options: ["急性心肌梗塞(AMI)", "主動脈剝離(Aortic Dissection)", "肺栓塞", "張力性氣胸"],
                correct: 1,
                weight: 1,
                rationale: "撕裂性胸痛、痛至背部、以及雙側上肢收縮壓顯著差異（>20 mmHg），是主動脈剝離的典型特徵。"
            },
            {
                q: "當操作 BVM（袋瓣罩甦醒球）為成人進行人工呼吸時，正確的壓袋頻率與通氣時間為何？",
                options: ["每 2-3 秒壓一次，每次 2 秒", "每 5-6 秒壓一次，每次約 1 秒", "每 8-10 秒壓一次，每次 1 秒", "配合心臟按壓，壓 15 下通氣 2 次"],
                correct: 1,
                weight: 1,
                rationale: "若病患已建立高級呼吸道或單純無呼吸有脈搏之復甦通氣，成人頻率為每 5-6 秒給一口氣，每口氣時間約 1 秒，見胸部起伏即可。"
            },
            {
                q: "創傷評估口訣「DCAP-BTLS」中的 'C' 代表什麼意思？",
                options: ["挫傷(Contusion)", "發紺(Cyanosis)", "骨折(Crepitus)", "嚴重出血(Clear)"],
                correct: 0,
                weight: 1,
                rationale: "DCAP-BTLS 意指：Deformities(畸形), Contusions(挫傷), Abrasions(擦傷), Punctures(穿刺傷), Burns(燒傷), Tenderness(壓痛), Lacerations(撕裂傷), Swelling(腫脹)。"
            },
            {
                q: "在評估中風病患時，經常使用的「辛辛那提院前中風評估表(CPSS)」不包含下列哪項檢查？",
                options: ["面部垂落(Facial Droop)", "手臂垂落(Arm Drift)", "言語異常(Speech)", "瞳孔對光反應(Pupils)"],
                correct: 3,
                weight: 1,
                rationale: "辛辛那提評估包含三項：微笑（看對稱）、舉手（看落差）、說話（看清晰度）。瞳孔不屬於 CPSS 項目。"
            },
